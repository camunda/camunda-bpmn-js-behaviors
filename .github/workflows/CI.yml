name: CI
on: [ push, pull_request ]
jobs:
  Build:

    permissions:
      contents: read
      id-token: write  # mint GitHub OIDC token for Vault JWT auth
    strategy:
      matrix:
        os: [ ubuntu-latest ]
        node-version: [ 24 ]

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Use Node.js
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - name: Install dependencies
      run: npm ci
    - name: Project setup
      uses: bpmn-io/actions/setup@latest
    - name: Build
      env:
        COVERAGE: 1
      run: npm run all
    - name: Import Secrets
      id: secrets
      uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc  # v4.0.0
      with:
        url: ${{ secrets.VAULT_ADDR }}
        method: jwt
        role: ${{ secrets.VAULT_JWT_ROLE }}
        path: ${{ secrets.VAULT_JWT_PATH }}
        jwtGithubAudience: ${{ secrets.VAULT_JWT_AUDIENCE }}
        exportEnv: false
        secrets: |
          secret/data/products/desktop-modeler/camunda/camunda-bpmn-js-behaviors CODECOV_TOKEN;
    - name: Upload coverage
      uses: codecov/codecov-action@v7
      with:
        fail_ci_if_error: true
      env:
        CODECOV_TOKEN: ${{ steps.secrets.outputs.CODECOV_TOKEN }}
